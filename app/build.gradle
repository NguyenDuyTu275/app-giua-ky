plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.kotlin.serialization)
}

// Thông tin khóa ký bản release, không có trong git (xem .gitignore)
def keystoreFile = rootProject.file('keystore.properties')

android {
    namespace 'com.example.gpaplanner'
    compileSdk 37

    defaultConfig {
        applicationId 'com.appgiuaky.gpaplanner'
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        // Máy clone repo mà không có keystore vẫn build được bản debug
        if (keystoreFile.exists()) {
            def props = new Properties()
            keystoreFile.withInputStream { props.load(it) }
            release {
                storeFile = rootProject.file(props.getProperty('storeFile'))
                storePassword = props.getProperty('storePassword')
                keyAlias = props.getProperty('keyAlias')
                keyPassword = props.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.findByName('release')
            optimization {
                enable = true
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        compose true
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.material.icons.core
    implementation libs.kotlinx.serialization.json
    debugImplementation libs.androidx.compose.ui.tooling
    testImplementation libs.junit
}
